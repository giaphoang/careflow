name: CareFlow verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: careflow_demo
          POSTGRES_USER: careflow
          POSTGRES_PASSWORD: careflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careflow -d careflow_demo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Java unit, integration, and PostgreSQL stress tests
        run: mvn -B -ntp -Ppostgres-tests verify
      - name: Frontend build
        working-directory: frontend
        run: npm ci && npm run build
      - name: Start synthetic demonstration
        env:
          DB_URL: jdbc:postgresql://localhost:5432/careflow_demo
          DB_USERNAME: careflow
          DB_PASSWORD: careflow
          CAREFLOW_DEMO_ENABLED: 'true'
        run: |
          java -jar target/hospital-management-system-0.0.1-SNAPSHOT.jar > target/demo.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl -fsS http://localhost:8080/v3/api-docs > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Browser workflow verification
        working-directory: frontend
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - name: Reproducible synthetic processing benchmark
        run: node scripts/processing-benchmark.mjs
      - name: Retain test and benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: careflow-verification
          retention-days: 30
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/benchmarks/
            target/demo.log
            frontend/playwright-report/
            frontend/test-results/
