spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/hms_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata
    show-sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:replace-with-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:replace-with-google-client-secret}
            scope:
              - openid
              - profile
              - email

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:1234567890123456789012345678901234567890123456789012345678901234}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

notification:
  simulation-enabled: ${NOTIFICATION_SIMULATION_ENABLED:true}
  http:
    connect-timeout-ms: ${NOTIFICATION_HTTP_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${NOTIFICATION_HTTP_READ_TIMEOUT_MS:10000}
  outbox:
    poll-ms: ${NOTIFICATION_OUTBOX_POLL_MS:5000}
    batch-size: ${NOTIFICATION_OUTBOX_BATCH_SIZE:50}
    max-attempts: ${NOTIFICATION_OUTBOX_MAX_ATTEMPTS:5}
    base-retry-seconds: ${NOTIFICATION_OUTBOX_BASE_RETRY_SECONDS:30}
  whatsapp:
    enabled: ${NOTIFICATION_WHATSAPP_ENABLED:false}
    provider: ${NOTIFICATION_WHATSAPP_PROVIDER:generic}
    api-url: ${NOTIFICATION_WHATSAPP_API_URL:http://localhost:8085/whatsapp/send}
    api-token: ${NOTIFICATION_WHATSAPP_API_TOKEN:}
    account-sid: ${NOTIFICATION_WHATSAPP_ACCOUNT_SID:}
    auth-token: ${NOTIFICATION_WHATSAPP_AUTH_TOKEN:}
    sender: ${NOTIFICATION_WHATSAPP_SENDER:HMS}
    default-country-code: ${NOTIFICATION_WHATSAPP_DEFAULT_COUNTRY_CODE:+91}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
