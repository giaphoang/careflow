      ddl-auto: create-drop
    open-in-view: false

jwt:
  secret: 1234567890123456789012345678901234567890123456789012345678901234
  access-expiration-ms: 900000
  refresh-expiration-ms: 604800000

security:
  revoked-token-cleanup-ms: 60000
